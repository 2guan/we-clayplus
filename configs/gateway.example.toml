owner = ""
forbidden = "没有权限执行此操作"
core_address = "127.0.0.1:8088"
core_token_env = "WE_CLAY_CORE_TOKEN"
data_dir = "./runtime/gateway/data"
plugins_dir = "./runtime/gateway/plugins"

# 自动下载/启动：取消下方注释，固定使用已发布的 core tag（如 v0.4.5）。
# 保持整个 [core] 段注释时，连接已有 core。
# [core]
# auth_key_env = "WE_CLAY_AUTH_KEY" # 运行授权：只填环境变量名，不能填 Key
# download_auth_base_url = "https://nww.hihfy.com/we-clay-auth" # 默认值；Key 下载 core 时调用此服务
# repository = "we-clay/core-release"
# version = "v0.4.5"
# keep_alive = false # true 时必须将 data_dir 改为固定的绝对账号目录
# cache_dir = "./runtime/core-bin"
# data_dir = "/absolute/path/to/existing/core-data" # 托管模式必填绝对路径；升级保留原账号目录
# login_address = "127.0.0.1:8201"
# device_name = "我的 Mac 机器人" # 可选；留空保留原名，变更需重启 core
# stage = "auto"
# github_token_env = "WE_CLAY_GITHUB_TOKEN"
# storage_encrypted = false

# 私有 OSS（启用后下载不会访问 GitHub；账号目录等 [core] 配置需一并启用）
# [core.oss]
# bucket = "weclay"
# region = "cn-beijing"
# prefix = "core"
# endpoint = "https://oss-cn-beijing.aliyuncs.com"
# cname = false
# 默认用 auth_key_env 指向的 Key 换取短时下载链接；原有 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET 仍可成对使用。

# Dashboard 与 AI 默认启用；Mock 只允许回环地址，运行期间不访问 core 或模型供应商。
[console]
address = "127.0.0.1:8208"
data_dir = "./runtime/console"
mock = false
disabled = false
disable_ai = false
